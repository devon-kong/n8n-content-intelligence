<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>From business need to inspectable automation</title><rect width="1600" height="1000" fill="#f2f6fa"/><rect width="1600" height="12" fill="#147d79"/><text x="60" y="65" fill="#147d79" font-size="20" font-weight="700" font-family="Arial, sans-serif">CONTENT INTELLIGENCE  /  n8n + Python</text><text x="60" y="130" fill="#142840" font-size="44" font-weight="700" font-family="Arial, sans-serif">From business need to inspectable automation</text><text x="60" y="177" fill="#53667c" font-size="24" font-weight="400" font-family="Arial, sans-serif">Reusable n8n delivery, with Python available for code-based integration needs.</text><rect x="60" y="245" width="720" height="570" rx="18" fill="#ffffff" stroke="#dbe4ec"/><rect x="820" y="245" width="720" height="570" rx="18" fill="#ffffff" stroke="#dbe4ec"/><text x="92" y="305" fill="#147d79" font-size="24" font-weight="700" font-family="Arial, sans-serif">MY CONTRIBUTION</text><text x="92" y="380" fill="#142840" font-size="26" font-weight="400" font-family="Arial, sans-serif">Business requirements and field contracts</text><text x="92" y="453" fill="#142840" font-size="26" font-weight="400" font-family="Arial, sans-serif">Shared Catch / optional enrichment design</text><text x="92" y="526" fill="#142840" font-size="26" font-weight="400" font-family="Arial, sans-serif">Incremental write and review policies</text><text x="92" y="599" fill="#142840" font-size="26" font-weight="400" font-family="Arial, sans-serif">Implementation with AI assistance</text><text x="92" y="672" fill="#142840" font-size="26" font-weight="400" font-family="Arial, sans-serif">Tests, deployment notes and handover</text><text x="852" y="305" fill="#147d79" font-size="24" font-weight="700" font-family="Arial, sans-serif">WHAT THIS EVIDENCE PROVES</text><text x="852" y="380" fill="#42576f" font-size="28" font-weight="400" font-family="Arial, sans-serif">A representative workflow runs in the real</text><text x="852" y="418" fill="#42576f" font-size="28" font-weight="400" font-family="Arial, sans-serif">n8n engine with synthetic service</text><text x="852" y="456" fill="#42576f" font-size="28" font-weight="400" font-family="Arial, sans-serif">boundaries.</text><text x="852" y="535" fill="#42576f" font-size="26" font-weight="400" font-family="Arial, sans-serif">Live provider compatibility, actual model</text><text x="852" y="571" fill="#42576f" font-size="26" font-weight="400" font-family="Arial, sans-serif">quality and production concurrency still</text><text x="852" y="607" fill="#42576f" font-size="26" font-weight="400" font-family="Arial, sans-serif">require dedicated acceptance.</text><text x="852" y="742" fill="#147d79" font-size="24" font-weight="700" font-family="Arial, sans-serif">Review source, tests and scope on GitHub.</text><text x="60" y="945" fill="#53667c" font-size="20" font-weight="400" font-family="Arial, sans-serif">SYNTHETIC DEMO · Real n8n engine; local mock connectors; authored model responses.</text><text x="60" y="977" fill="#53667c" font-size="18" font-weight="400" font-family="Arial, sans-serif">Rendered evidence walkthrough · not a Feishu UI capture, live screencast or AI-quality evaluation.</text></svg>