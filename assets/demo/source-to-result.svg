<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>Keep the source and the uncertainty</title><rect width="1600" height="1000" fill="#f2f6fa"/><rect width="1600" height="12" fill="#147d79"/><text x="60" y="65" fill="#147d79" font-size="20" font-weight="700" font-family="Arial, sans-serif">CONTENT INTELLIGENCE  /  n8n + Python</text><text x="60" y="130" fill="#142840" font-size="44" font-weight="700" font-family="Arial, sans-serif">Keep the source and the uncertainty</text><text x="60" y="177" fill="#53667c" font-size="24" font-weight="400" font-family="Arial, sans-serif">Original article → benchmark parser → structured fields in the simulated destination.</text><rect x="60" y="235" width="710" height="600" rx="18" fill="#ffffff" stroke="#dbe4ec"/><rect x="810" y="235" width="730" height="600" rx="18" fill="#ffffff" stroke="#dbe4ec"/><text x="90" y="290" fill="#147d79" font-size="22" font-weight="700" font-family="Arial, sans-serif">01  SOURCE MATERIAL</text><text x="90" y="350" fill="#42576f" font-size="28" font-weight="400" font-family="Arial, sans-serif">Fictional example: Harbor Market published</text><text x="90" y="388" fill="#42576f" font-size="28" font-weight="400" font-family="Arial, sans-serif">an updated import checklist. It adds a</text><text x="90" y="426" fill="#42576f" font-size="28" font-weight="400" font-family="Arial, sans-serif">translated label and a distributor contact.</text><text x="90" y="464" fill="#42576f" font-size="28" font-weight="400" font-family="Arial, sans-serif">The effective date is not stated.</text><text x="90" y="685" fill="#142840" font-size="29" font-weight="700" font-family="Arial, sans-serif">A missing date stays missing.</text><text x="90" y="735" fill="#42576f" font-size="23" font-weight="400" font-family="Arial, sans-serif">A researcher can identify what needs follow-</text><text x="90" y="768" fill="#42576f" font-size="23" font-weight="400" font-family="Arial, sans-serif">up before relying on the brief.</text><text x="840" y="290" fill="#147d79" font-size="22" font-weight="700" font-family="Arial, sans-serif">02  STORED STRUCTURED OUTPUT</text><text x="840" y="350" fill="#42576f" font-size="28" font-weight="400" font-family="Arial, sans-serif">The revised checklist asks for a translated</text><text x="840" y="388" fill="#42576f" font-size="28" font-weight="400" font-family="Arial, sans-serif">label and a distributor contact. The</text><text x="840" y="426" fill="#42576f" font-size="28" font-weight="400" font-family="Arial, sans-serif">effective date is missing and requires</text><text x="840" y="464" fill="#42576f" font-size="28" font-weight="400" font-family="Arial, sans-serif">follow-up.</text><text x="840" y="575" fill="#147d79" font-size="25" font-weight="700" font-family="Arial, sans-serif">Category: Policy update</text><text x="840" y="630" fill="#142840" font-size="28" font-weight="700" font-family="Arial, sans-serif">Effective date: Not stated</text><text x="840" y="700" fill="#42576f" font-size="23" font-weight="400" font-family="Arial, sans-serif">This example checks parsing and writeback of an</text><text x="840" y="733" fill="#42576f" font-size="23" font-weight="400" font-family="Arial, sans-serif">authored response. It does not measure model</text><text x="840" y="766" fill="#42576f" font-size="23" font-weight="400" font-family="Arial, sans-serif">accuracy.</text><text x="60" y="945" fill="#53667c" font-size="20" font-weight="400" font-family="Arial, sans-serif">SYNTHETIC DEMO · Real n8n engine; local mock connectors; authored model responses.</text><text x="60" y="977" fill="#53667c" font-size="18" font-weight="400" font-family="Arial, sans-serif">Rendered evidence walkthrough · not a Feishu UI capture, live screencast or AI-quality evaluation.</text></svg>