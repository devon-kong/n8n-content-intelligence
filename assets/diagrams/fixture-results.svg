<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img"><title>Content Intelligence Automation — architecture or synthetic fixture illustration</title><rect width="1200" height="530" rx="24" fill="#0c1628"/><text x="50" y="59" fill="#75d7cf" font-size="16" font-weight="700" font-family="Arial, sans-serif">SYNTHETIC CATCH DEMONSTRATION</text><text x="50" y="108" fill="#e8eef9" font-size="32" font-weight="700" font-family="Arial, sans-serif">Same input. Matching article IDs and decisions.</text><text x="50" y="146" fill="#b3c4dc" font-size="20" font-weight="400" font-family="Arial, sans-serif">External storage is simulated. No live n8n engine, LLM or provider call.</text><rect x="50" y="188" width="1100" height="120" rx="16" fill="#17243b" stroke="#30425e"/><text x="76" y="223" fill="#e8eef9" font-size="20" font-weight="700" font-family="Arial, sans-serif">Exported n8n Code nodes · Node.js harness</text><text x="76" y="276" fill="#75d7cf" font-size="32" font-weight="700" font-family="Arial, sans-serif">1  CREATE</text><text x="420" y="276" fill="#ffd296" font-size="32" font-weight="700" font-family="Arial, sans-serif">1  UPDATE</text><text x="770" y="276" fill="#abbbff" font-size="32" font-weight="700" font-family="Arial, sans-serif">1  SKIP</text><rect x="50" y="333" width="1100" height="120" rx="16" fill="#17243b" stroke="#30425e"/><text x="76" y="368" fill="#e8eef9" font-size="20" font-weight="700" font-family="Arial, sans-serif">Python normalization + upsert functions</text><text x="76" y="421" fill="#75d7cf" font-size="32" font-weight="700" font-family="Arial, sans-serif">1  CREATE</text><text x="420" y="421" fill="#ffd296" font-size="32" font-weight="700" font-family="Arial, sans-serif">1  UPDATE</text><text x="770" y="421" fill="#abbbff" font-size="32" font-weight="700" font-family="Arial, sans-serif">1  SKIP</text><text x="50" y="496" fill="#8a9db9" font-size="17" font-weight="400" font-family="Arial, sans-serif">Actual fixture output is committed as JSON; this graphic is a rendered results illustration.</text></svg>